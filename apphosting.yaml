# Firebase App Hosting settings (PLAN.md sections 2 and 13).
# NEXT_PUBLIC_* values are safe to commit: they ship to the browser anyway.
# Server secrets live in Cloud Secret Manager. Create them once with:
#   firebase apphosting:secrets:set GEMINI_API_KEY
#   firebase apphosting:secrets:set GOOGLE_MAPS_SERVER_KEY

runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_ME.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: REPLACE_ME
    availability: [BUILD, RUNTIME]
  - variable: GEMINI_MODEL
    value: gemini-2.5-flash
    availability: [RUNTIME]
  - variable: DEMO_FIXTURES
    value: "false"
    availability: [RUNTIME]
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability: [RUNTIME]
  - variable: GOOGLE_MAPS_SERVER_KEY
    secret: GOOGLE_MAPS_SERVER_KEY
    availability: [RUNTIME]
